[package]
name = "blob-simulator-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
num-traits = "0.2.19"
rand = "0.10.2"
rayon = "1.12.0"
softbuffer = "0.4.8"
winit = "0.31.0-beta.3"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# Deny panic-prone operations
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

# Already part of `pedantic`, repeated here for documentation
enum_glob_use = "deny"
unchecked_time_subtraction = "deny"

# Additional opinionated idiom lints
clone_on_ref_ptr = "deny"
clone_on_copy = "deny"
undocumented_unsafe_blocks = "forbid"
